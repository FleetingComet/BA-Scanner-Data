name: Update SchaleDB Data

on:
  schedule:
    # for every 2 weeks on the 1st and the 15th of every month
    - cron: "30 1 1,15 * *" # https://stackoverflow.com/a/46233330
  workflow_dispatch: # manual triggering

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run batch data processing
        run: |
          python main.py
      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json

          # Only commit if changes exist
          if ! git diff --staged --quiet; then
            git commit -m "Update data from SchaleDB on $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No data changes detected. Skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
